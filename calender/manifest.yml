
modules:
  jira:globalPage:
    - key: space-calendar-jira
      resource: main
      resolver:
        function: resolver
      title: Space Calendar for Jira
      layout: blank

  webtrigger:
    - key: jira-calendar-ics-feed
      function: ics-feed-handler
      urlFormat: v2
      response:
        type: dynamic

  function:
    - key: resolver
      handler: index.handler
    - key: ics-feed-handler
      handler: index.icsFeed

resources:
  - key: main
    path: static/hello-world/build

app:
  id: ari:cloud:ecosystem::app/c9e77dc8-fe86-444c-a26e-da82f20ab8d8
  runtime:
    name: nodejs22.x

permissions:
  scopes:
    - read:jira-work
